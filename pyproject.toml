# Python tool config. Lint config lives in ruff.toml; this carries Black + coverage.
# (Black and ruff agree on an 88–100 col range; line-length is advisory in ruff.)

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(\.venv|data|frontend)/
'''

[tool.coverage.run]
source = ["backend"]
omit = ["backend/rerender_spectrograms.py"]

[tool.coverage.report]
show_missing = true
# The high-value pure-logic modules; heavy IO modules (app/segment/jobs) are
# covered more thinly until their integration tests land.
