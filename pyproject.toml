# Python tool config. Lint config lives in ruff.toml; this carries Black + coverage.
# (Black and ruff agree on an 88–100 col range; line-length is advisory in ruff.)

[tool.pytest.ini_options]
# Put the repo root on sys.path so `from backend import ...` resolves whether pytest
# is run as `pytest` (CI) or `python -m pytest` (the Makefile); without this CI fails
# collection with ModuleNotFoundError: No module named 'backend'.
pythonpath = ["."]
# `bench` is deselected by DEFAULT. This line is the whole mechanism — without it a marker
# is a label, not a gate. `perf` spent its whole life documented as "deselect with
# -m 'not perf'" while nothing anywhere passed that flag, so the wall-clock budgets ran in
# CI regardless; the comment under `fail_under` below records the identical mistake being
# made once already. A trailing `-m bench` on the command line overrides this (addopts is
# prepended), which is how `make bench` runs them.
addopts = ["-m", "not bench"]
markers = [
    # Wall-clock budgets (tests/test_perf_budget.py). Loose by design — they catch a 10x
    # regression, not milliseconds. These DO run in CI, and should: a 10x ceiling on a
    # 0.3s render is worth gating every push.
    "perf: order-of-magnitude performance guard",
    # Recorded baselines (tests/test_perf_baseline.py). Seconds long and machine-specific,
    # so they are opt-in and never run in CI — a perf test that flakes gets muted, and a
    # muted test is worse than none.
    "bench: recorded performance baseline; run with `make bench` or `pytest -m bench`",
]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(\.venv|data|frontend)/
'''

[tool.coverage.run]
source = ["backend"]
omit = ["backend/rerender_spectrograms.py"]

[tool.coverage.report]
show_missing = true
# A ratchet, not a target. Measured 81% on the full suite (2026-07-27); 76 leaves
# room for a normal feature commit while still failing loudly if a large uncovered
# surface lands at once. Raise it when a coverage step banks real ground — the
# thin modules today are imagegen.py (27%), llm.py (28%), routes/uploads.py (52%)
# and segment.py (43%).
#
# Two figures in the previous version of this comment had gone badly stale, which is
# the failure this block keeps warning about: routes/export.py was cited at 46% and is
# 80%, and seed_card_demo.py at 17% is 81%. Re-measure when you touch this.
# This replaces a comment that described an include/fail_under setting nobody had
# written, so "coverage is a gate" was true in prose only. The figures above were
# themselves stale by 2026-07-20 (they claimed 75% total and render_jobs.py at 25%,
# which had since reached 99%) — re-measure when you touch this, do not inherit it.
fail_under = 76
