# Dev: Docker runs ONLY Postgres. The app (Flask + Vite) runs natively so it can
# use the Apple-Silicon GPU (MPS) — Metal is not reachable from a Linux
# container. Start it with `docker compose up -d db` (or `make dev`).
name: demucs_studio   # pin project name so the Postgres volume is stable across folders
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: demucs
      POSTGRES_PASSWORD: demucs
      POSTGRES_DB: demucs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demucs -d demucs"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
