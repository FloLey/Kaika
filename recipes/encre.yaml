name: encre
version: 2
seed: 1107

canvas:
  width: 1024
  height: 1024
  fps: 24
  sim_resolution: 512

palettes:
  main: ["#2a2a2a", "#4a4a4a", "#6c6c6c", "#9a9a9a", "#d9d9d9"]

field:
  dissipation: 0.92
  vorticity: 4.0
  ambient: { strength: 1.4, scale: 2.2, speed: 0.12 }

render:
  exposure: 1.9
  bloom: { amount: 0.5, threshold: 0.5 }
  background: 0.12                  # paper tone; an rms modulator breathes it
  background_color:                 # stays monochrome: centroid lightens the
    type: centroid_ramp             # paper as the spectrum brightens
    dark: "#1C1C20"
    bright: "#D9D9D9"
    brightness: { source: rms, range: [0.7, 1.5] }
  background_smooth_s: 0.8

emitters:
  - id: kicks
    trigger:   { type: onset, band: low }
    placement: { type: wander, center: [0.5, 0.5], wander_amp: 0.16, jitter: 0.09 }
    direction: { type: radial_out, jitter: 0.5 }
    color:     { type: palette, palette: main, index: 0 }
    body:      { radius: 0.16, force: 7000, lifetime_s: 1.4, emit: 0.16, drift: 0.7, speed: 1.3 }
  - id: hats
    trigger:   { type: onset, band: high, max_per_frame: 7 }
    placement: { type: random, region: [0.08, 0.08, 0.92, 0.92] }
    direction: { type: random }
    color:
      type: palette_cycle
      palette: main
      start: 1
      brightness: { source: centroid, range: [0.75, 1.25] }
    body:      { radius: 0.025, force: 2600, lifetime_s: 0.25, emit: 0.10, drift: 0.3, speed: 2.6 }
  - id: wash                        # harmonic passages leave slow grey washes
    trigger:   { type: continuous, every_frames: 18, when: "harmonic_ratio > 0.6" }
    placement: { type: random, region: [0.15, 0.15, 0.85, 0.85] }
    direction: { type: flow, jitter: 0.3 }
    color:     { type: centroid_ramp, dark: "#2a2a2a", bright: "#d9d9d9" }
    body:      { radius: 0.10, force: 800, lifetime_s: 1.8, emit: 0.05, drift: 0.9, speed: 0.4 }
  - id: tension
    trigger:   { type: lookahead, section: drop, window_s: 6.0, every_frames: 3 }
    placement: { type: random, region: [0.2, 0.2, 0.8, 0.8] }
    direction: { type: random }
    color:     { type: palette, palette: main, index: 0, brightness: { source: fixed, value: 0.6 } }
    body:      { radius: 0.08, force: 1500, lifetime_s: 0.7, emit: 0.10, drift: 0.6, speed: 0.8 }

modulators:
  - { source: rms, target: field.vorticity, mode: absolute, range: [4, 24] }
  - { source: rms, target: field.ambient.strength, mode: absolute, range: [0.17, 1.4] }
  - { source: rms, target: render.background, mode: absolute, range: [0.06, 0.22], smooth_s: 0.4 }

diffusion:
  model: wan-2.2-vace
  backend: local
  strength: 0.45
  control: [depth, flow]
  chunk_s: 5.0
  overlap_frames: 24

prompts:
  base: "black ink diffusing in water, sumi-e, monochrome, high contrast"
  intro: "a single drop of ink hitting still water"
  build: "ink tendrils reaching, gathering"
  drop:  "violent bloom of black ink, fractal plumes"
  verse: "slow ink drift, grey washes"
  outro: "ink settling, clearing water"
  default: "ink in water, abstract"
